<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Post Brainstorm · אייל</title>
<style>
  :root{
    --bg:#F7F5F0; --ink:#1B2A4A; --soft:#5A6784; --card:#FFFFFF;
    --coral:#FF6B5E; --teal:#2BB3A3; --yellow:#FFC940; --purple:#7B61FF;
    --line:#E8E4DB; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Heebo","Rubik",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    padding:14px 16px 60px; max-width:520px;margin:0 auto; line-height:1.55;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{font-size:14px;font-weight:900;letter-spacing:.03em;color:var(--coral)}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--soft);letter-spacing:0}
  .gen-btn{
    border:none;cursor:pointer;font-family:inherit;
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;
    padding:9px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 2px 8px rgba(27,42,74,.18);
  }
  .gen-btn:active{transform:scale(.97)}

  /* Tabs */
  nav{
    position:sticky;top:8px;z-index:20;display:flex;gap:6px;
    background:#EFEBE1;border-radius:999px;padding:4px;margin-bottom:16px;
    box-shadow:0 1px 4px rgba(27,42,74,.08);
  }
  nav button{
    flex:1;border:none;cursor:pointer;font-family:inherit;
    background:transparent;color:var(--soft);font-size:13.5px;font-weight:700;
    padding:9px 4px;border-radius:999px;transition:all .15s;
  }
  nav button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(27,42,74,.12)}
  .tab{display:none}
  .tab.active{display:block}

  /* Feed (brief) */
  .date-chip{position:sticky;top:56px;z-index:5;text-align:center;margin:18px 0 14px}
  .date-chip span{display:inline-block;background:#E9E4D8;color:#6B6349;font-size:12px;font-weight:700;padding:6px 16px;border-radius:999px;box-shadow:0 1px 4px rgba(27,42,74,.08)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(27,42,74,.05);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:var(--accent,var(--coral))}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb, var(--accent,var(--coral)) 12%, white);color:var(--accent,var(--coral));border:1px dashed color-mix(in srgb, var(--accent,var(--coral)) 45%, white)}
  .tag.me{background:#FFF7DF;color:#9A7400;border-color:#EED89A}
  .hook{font-size:18px;font-weight:800;line-height:1.42;margin-bottom:10px}
  .label{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.06em;margin-bottom:2px}
  .angle{font-size:14.5px;color:#33405F;margin-bottom:10px}
  .why{font-size:13.5px;color:#33405F;background:#F3F1EA;border-radius:12px;padding:9px 12px;margin-bottom:12px}
  .why b{color:var(--ink)}
  .card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:11px;margin-top:2px}
  .src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;text-decoration:none;color:var(--ink);background:#EFF3FB;border:1px solid #DCE4F5;padding:7px 12px;border-radius:999px}
  .src small{color:var(--soft);font-weight:400}
  .expand-btn{border:none;cursor:pointer;font-family:inherit;margin-inline-start:auto;background:var(--accent,var(--coral));color:#fff;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .expand-btn:active{transform:scale(.97)}

  /* Ready prompts row */
  .prompts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .p-btn{
    border:1px dashed #CFD7E8;cursor:pointer;font-family:inherit;
    background:#F5F7FC;color:#3B4A6B;font-size:11.5px;font-weight:700;
    padding:6px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;
  }
  .p-btn.ready{background:#EAF7F4;border-color:#A9DED4;color:#1D7A6C}
  .p-btn:active{transform:scale(.96)}

  /* Used state */
  .feed-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#EFEBE1;border-radius:14px;padding:8px 10px;margin-bottom:4px}
  .feed-bar .cnt{font-size:11.5px;font-weight:700;color:#6B6349;margin-inline-end:auto}
  .fb-btn{border:1px solid #DDD6C6;cursor:pointer;font-family:inherit;background:#fff;color:#5A6784;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:999px}
  .fb-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .use-btn{border:1px dashed #D8D2C2;cursor:pointer;font-family:inherit;background:#fff;color:var(--soft);font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:999px}
  .use-btn.on{background:#EAF7F4;border:1px solid #A9DED4;color:#1D7A6C}
  .wa-btn{border:1px solid #BFE7C9;cursor:pointer;font-family:inherit;background:#E9F8EE;color:#12704A;font-size:11.5px;font-weight:800;padding:7px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
  .wa-btn:active{transform:scale(.96)}
  .wa-btn svg{width:14px;height:14px;fill:currentColor}
  .card.used{opacity:.5}
  .card.used .hook{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#B9C0CF}
  .tag.usedtag{background:#EAF7F4;color:#1D7A6C;border-color:#A9DED4}
  h2{font-size:14px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px;color:var(--soft)}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .art{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:9px}
  .art b{font-size:14px;display:block;margin-bottom:2px;line-height:1.4}
  .art p{font-size:12.5px;color:var(--soft)}
  .art .meta{font-size:11px;color:var(--coral);font-weight:700;margin-top:5px;display:block}

  /* Approaches */
  .ap-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(27,42,74,.05);position:relative;overflow:hidden}
  .ap-card::before{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:var(--ac)}
  .ap-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .ap-emoji{font-size:26px;line-height:1}
  .ap-name{font-size:17px;font-weight:900}
  .ap-tagline{font-size:13.5px;color:#33405F;margin-bottom:10px}
  .ap-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F3F1EA;color:#6B6349;border:1px solid #E8E2D2}
  .ap-open{border:none;cursor:pointer;font-family:inherit;width:100%;background:color-mix(in srgb, var(--ac) 12%, white);color:var(--ac);font-size:13px;font-weight:800;padding:10px;border-radius:12px;border:1px dashed color-mix(in srgb, var(--ac) 40%, white)}
  .ap-open:active{transform:scale(.98)}

  /* Approach full page */
  #ap-page{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none;padding:14px 16px 60px}
  #ap-page.open{display:block}
  .ap-page-inner{max-width:520px;margin:0 auto}
  .ap-back{border:none;cursor:pointer;font-family:inherit;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;margin-bottom:14px;box-shadow:0 1px 3px rgba(27,42,74,.08)}
  .ap-hero{border-radius:20px;padding:22px 18px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden}
  .ap-hero .ap-emoji{font-size:38px;display:block;margin-bottom:6px}
  .ap-hero h1{font-size:23px;font-weight:900;line-height:1.3;margin-bottom:4px}
  .ap-hero p{font-size:14px;opacity:.92}
  .sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px}
  .sec h3{font-size:13px;font-weight:800;color:var(--soft);letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .sec p{font-size:14px;color:#33405F}
  .sec ol{padding-inline-start:20px;font-size:14px;color:#33405F}
  .sec ol li{margin-bottom:6px}
  .sec ul{padding-inline-start:20px;font-size:14px;color:#33405F}
  .sec ul li{margin-bottom:5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:#F3F1EA;color:#6B6349}
  .prompt-box{background:#1B2A4A;color:#DCE4F5;border-radius:12px;padding:12px;font-size:12px;direction:ltr;text-align:left;font-family:ui-monospace,monospace;line-height:1.5;margin-top:8px;word-break:break-word}
  .copy-mini{border:none;cursor:pointer;font-family:inherit;background:var(--teal);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;margin-top:8px}
  .ex-hook{background:#FFF7DF;border:1px dashed #EED89A;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600;color:#6B5A1B}
  .write-btn{border:none;cursor:pointer;font-family:inherit;width:100%;background:var(--ink);color:#fff;font-size:14px;font-weight:800;padding:13px;border-radius:14px;margin-top:4px;box-shadow:0 2px 8px rgba(27,42,74,.2)}

  /* Links */
  .lk-cat{margin-bottom:20px}
  .lk-cat h2{margin-top:0}
  .lk{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;position:relative}
  .lk b{font-size:13.5px;display:block;line-height:1.4}
  .lk p{font-size:12px;color:var(--soft);margin-top:1px}
  .lk .lk-tag{position:absolute;top:10px;left:12px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#EFF3FB;color:#4A5A80}

  #toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(80px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(27,42,74,.3);transition:transform .25s ease;z-index:60;max-width:92%;text-align:center}
  #toast.show{transform:translateX(50%) translateY(0)}
  footer{margin-top:26px;text-align:center;font-size:11.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:12px}
  .loading{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="brand">POST BRAINSTORM<small>המערכת של אייל</small></div>
  <button class="gen-btn" onclick="copyCmd('צור עוד 3 רעיונות לפוסטים לבריף של היום, בנוסף לאלה שכבר יש, ועדכן את הדף')">⚡ צור עוד רעיונות</button>
</header>

<nav>
  <button class="active" data-tab="feed" onclick="showTab('feed')">💡 רעיונות לפוסטים</button>
  <button data-tab="approaches" onclick="showTab('approaches')">🎯 גישות פוסטים</button>
  <button data-tab="links" onclick="showTab('links')">🔗 מאגרי לינקים</button>
</nav>

<div id="feed" class="tab active"><div class="loading">טוען את הבריף...</div></div>
<div id="approaches" class="tab"><div class="loading">טוען גישות...</div></div>
<div id="links" class="tab"><div class="loading">טוען לינקים...</div></div>

<div id="ap-page"><div class="ap-page-inner" id="ap-page-content"></div></div>

<footer>לחיצה על כפתור מעתיקה פקודה מוכנה. מדביקים בקלוד והוא ממשיך משם.</footer>
<div id="toast">הועתק, הדבק בקלוד 👌</div>

<script>
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function copyCmd(cmd){
  const done=()=>{const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cmd).then(done).catch(()=>fallback(cmd,done))}
  else fallback(cmd,done);
}
function fallback(cmd,done){
  const ta=document.createElement('textarea');ta.value=cmd;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');done()}catch(e){prompt('העתק ידנית:',cmd)}
  document.body.removeChild(ta);
}
const SITE='https://eyalg1980.github.io/ai-post-brainstorm/';
const WA_ICON='<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.3c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18c-1.5 0-3-.4-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3C4.4 15 4 13.5 4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8zm4.4-5.8c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.2.2-.3.2-.4.1-.2 0-.3 0-.4 0-.1-.6-1.3-.8-1.8-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.4c.1.2 1.6 2.5 3.9 3.4.5.2 1 .4 1.3.5.6.2 1.1.2 1.5.1.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1 0-.1-.2-.2-.4-.3z"/></svg>';
function waShare(text){
  const url='https://wa.me/?text='+encodeURIComponent(text);
  window.open(url,'_blank','noopener');
}
function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id===id));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  window.scrollTo({top:0});
}

/* ---------- Brief feed ---------- */
let FEED=null, PBANK=[], WABANK=[];
const LS_USED='apb_used', LS_HIDE='apb_hide_used';
function usedSet(){try{return new Set(JSON.parse(localStorage.getItem(LS_USED)||'[]'))}catch(e){return new Set()}}
function saveUsed(s){try{localStorage.setItem(LS_USED,JSON.stringify([...s]))}catch(e){}}
function hideUsed(){return localStorage.getItem(LS_HIDE)==='1'}

/* Four ready copy targets per idea. If the daily run supplied idea.prompts, they are pasted as-is
   (ready prompts). Otherwise we build a command for Claude out of the idea itself. */
function buildPrompts(idea,day){
  const p=idea.prompts||{};
  const ref='הרעיון: "'+idea.hook+'". הזווית: '+idea.angle;
  return [
    {k:'image', i:'🖼️', label:'ויזואל לפוסט', ready:!!p.image,
     val: p.image ? ('צור לי תמונה בהיגספילד לפי הפרומפט הזה: '+p.image) :
                    ('צור לי ויזואל לפוסט הזה: כתוב פרומפט תמונה באנגלית בשפה הוויזואלית של סימפלה, ואז הרץ אותו בהיגספילד. '+ref)},
    {k:'video', i:'🎬', label:'רילס קצר', ready:!!p.video,
     val: p.video ? ('צור לי סרטון בהיגספילד לפי הפרומפט הזה: '+p.video) :
                    ('הפוך את הרעיון הזה לרילס של 15 עד 20 שניות: תסריט קצר, שוט ליסט ופרומפט וידאו מוכן להיגספילד ב-9:16. '+ref)},
    {k:'carousel', i:'🎠', label:'קרוסלה', ready:!!p.carousel,
     val: p.carousel || ('פרק את הרעיון הזה לקרוסלה של 6 עד 7 שקפים: כותרת לכל שקף, שורת גוף אחת, ושקף אחרון עם שאלה. '+ref)},
    {k:'raw', i:'📝', label:'טקסט גולמי', ready:true,
     val: 'הוק: '+idea.hook+'\n\nזווית: '+idea.angle+'\n\nלמה עכשיו: '+idea.why+'\n\nמקור: '+(idea.srcLabel||'')+' '+(idea.srcUrl||'')+'\n(בריף '+day.dateLabel+')'}
  ];
}

function renderFeed(data){
  if(data)FEED=data;
  const feed=document.getElementById('feed');
  const used=usedSet(), hide=hideUsed();
  PBANK=[]; WABANK=[];
  const days=[...FEED.days].sort((a,b)=>b.date.localeCompare(a.date));
  let total=0, nUsed=0, pending=[];
  for(const day of days)for(const idea of (day.ideas||[])){
    total++;
    const isUsed=used.has(idea.id)||idea.used===true;
    if(isUsed)nUsed++;
    if(used.has(idea.id)&&idea.used!==true)pending.push(idea.id);
  }
  let html='<div class="feed-bar"><span class="cnt">'+nUsed+' נוצלו מתוך '+total+' רעיונות</span>';
  html+='<button class="fb-btn'+(hide?' on':'')+'" id="fb-hide">'+(hide?'מציג רק פתוחים':'הסתר נוצלו')+'</button>';
  if(pending.length)html+='<button class="fb-btn" id="fb-sync">שמור בקובץ ('+pending.length+')</button>';
  html+='<button class="wa-btn" id="fb-wa">'+WA_ICON+' שתף את האפליקציה</button>';
  html+='</div>';
  for(const day of days){
    const ideas=(day.ideas||[]).filter(i=>!(hide&&(used.has(i.id)||i.used===true)));
    if(!ideas.length&&hide)continue;
    html+='<section><div class="date-chip"><span>'+esc(day.dateLabel)+'</span></div>';
    for(const idea of ideas){
      const isUsed=used.has(idea.id)||idea.used===true;
      const cmd='כתוב פוסט מלא בקול שלי מהרעיון הזה (בריף '+day.dateLabel+'): "'+idea.hook+'"';
      html+='<article class="card'+(isUsed?' used':'')+'" style="--accent:'+esc(idea.color||'#FF6B5E')+'">';
      html+='<div class="tags"><span class="tag">'+esc(idea.pillar)+'</span>';
      if(idea.me)html+='<span class="tag me">✦ '+esc(idea.me)+'</span>';
      if(isUsed)html+='<span class="tag usedtag">✓ נוצל</span>';
      html+='</div><div class="hook">"'+esc(idea.hook)+'"</div>';
      html+='<div class="label">הזווית</div><div class="angle">'+esc(idea.angle)+'</div>';
      html+='<div class="why"><b>למה עכשיו:</b> '+esc(idea.why)+'</div>';
      const pi=PBANK.push(buildPrompts(idea,day))-1;
      html+='<div class="label">פרומפטים מוכנים</div><div class="prompts">';
      PBANK[pi].forEach(p=>{html+='<button class="p-btn'+(p.ready?' ready':'')+'" data-p="'+pi+'" data-k="'+p.k+'">'+p.i+' '+p.label+'</button>'});
      html+='</div>';
      html+='<div class="card-actions">';
      if(idea.srcUrl)html+='<a class="src" href="'+esc(idea.srcUrl)+'" target="_blank" rel="noopener">🔗 '+esc(idea.srcLabel||'מקור')+(idea.srcDate?' <small>· '+esc(idea.srcDate)+'</small>':'')+'</a>';
      const wi=WABANK.push('"'+idea.hook+'"\n\n'+idea.angle+'\n\n'+(idea.srcUrl?'מקור: '+idea.srcUrl+'\n\n':'')+'מתוך הבריף של '+day.dateLabel+':\n'+SITE)-1;
      html+='<button class="wa-btn" data-wa="'+wi+'">'+WA_ICON+'</button>';
      html+='<button class="use-btn'+(isUsed?' on':'')+'" data-use="'+esc(idea.id)+'">'+(isUsed?'✓ נוצל':'סמן כנוצל')+'</button>';
      html+='<button class="expand-btn" data-cmd="'+esc(cmd)+'">✍️ כתוב פוסט מלא</button>';
      html+='</div></article>';
    }
    if(day.articles&&day.articles.length){
      html+='<h2>שווה קריאה</h2>';
      for(const a of day.articles){
        html+='<a class="art" href="'+esc(a.url)+'" target="_blank" rel="noopener"><b>'+esc(a.title)+'</b><p>'+esc(a.desc)+'</p><span class="meta">'+esc(a.meta)+'</span></a>';
      }
    }
    html+='</section>';
  }
  feed.innerHTML=html;
  feed.querySelectorAll('.expand-btn').forEach(b=>b.addEventListener('click',()=>copyCmd(b.dataset.cmd)));
  feed.querySelectorAll('.p-btn').forEach(b=>b.addEventListener('click',()=>{
    const p=(PBANK[+b.dataset.p]||[]).find(x=>x.k===b.dataset.k); if(p)copyCmd(p.val);
  }));
  feed.querySelectorAll('.use-btn').forEach(b=>b.addEventListener('click',()=>{
    const s=usedSet(), id=b.dataset.use;
    if(s.has(id))s.delete(id); else s.add(id);
    saveUsed(s); renderFeed();
  }));
  feed.querySelectorAll('.wa-btn[data-wa]').forEach(b=>b.addEventListener('click',()=>waShare(WABANK[+b.dataset.wa])));
  const fw=document.getElementById('fb-wa');
  if(fw)fw.addEventListener('click',()=>waShare('Post Brainstorm, הרעיונות לפוסטים של היום:\n'+SITE));
  const fh=document.getElementById('fb-hide');
  if(fh)fh.addEventListener('click',()=>{localStorage.setItem(LS_HIDE,hide?'0':'1');renderFeed()});
  const fs=document.getElementById('fb-sync');
  if(fs)fs.addEventListener('click',()=>copyCmd('סמן את הרעיונות האלה כנוצלו ב-posts.json (used: true) ופרסם: '+pending.join(', ')));
}

/* ---------- Approaches ---------- */
let APPROACHES=[];
function renderApproaches(data){
  APPROACHES=data.approaches;
  const el=document.getElementById('approaches');
  let html='<p style="font-size:13px;color:var(--soft);margin-bottom:14px">8 גישות מנותחות לעומק. לחיצה על דף גישה פותחת את המפרט המלא, כולל פרומפט מוכן לויזואל.</p>';
  for(const a of APPROACHES){
    html+='<div class="ap-card" style="--ac:'+esc(a.color)+'">';
    html+='<div class="ap-head"><span class="ap-emoji">'+a.emoji+'</span><span class="ap-name">'+esc(a.name)+'</span></div>';
    html+='<div class="ap-tagline">'+esc(a.tagline)+'</div>';
    html+='<div class="ap-badges">'+a.badges.map(b=>'<span class="badge">'+esc(b)+'</span>').join('')+'</div>';
    html+='<button class="ap-open" data-id="'+esc(a.id)+'">📄 דף גישה</button>';
    html+='</div>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.ap-open').forEach(b=>b.addEventListener('click',()=>openApproach(b.dataset.id)));
}
function openApproach(id){
  const a=APPROACHES.find(x=>x.id===id); if(!a)return;
  const c=document.getElementById('ap-page-content');
  let h='<button class="ap-back" onclick="closeApproach()">← חזרה לגישות</button>';
  h+='<div class="ap-hero" style="background:'+esc(a.color)+'"><span class="ap-emoji">'+a.emoji+'</span><h1>'+esc(a.name)+'</h1><p>'+esc(a.tagline)+'</p></div>';
  h+='<div class="sec"><h3>🧭 תחומים שאפשר להחיל עליהם</h3><div class="chips">'+a.domains.map(d=>'<span class="chip">'+esc(d)+'</span>').join('')+'</div></div>';
  h+='<div class="sec"><h3>🏗️ המבנה, צעד אחרי צעד</h3><ol>'+a.structure.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>';
  h+='<div class="sec"><h3>🎨 ויזואל · '+esc(a.visual.type)+'</h3><p>'+esc(a.visual.desc)+'</p>';
  if(a.visual.higgsfieldPrompt){
    h+='<p style="margin-top:8px;font-size:12px;color:var(--soft)">פרומפט היגספילד ('+esc(a.visual.higgsfieldModel)+'), מחליפים את מה שבסוגריים:</p>';
    h+='<div class="prompt-box">'+esc(a.visual.higgsfieldPrompt)+'</div>';
    h+='<button class="copy-mini" onclick=\'copyCmd('+JSON.stringify('צור לי ויזואל בהיגספילד לפי הפרומפט הזה, מודל '+a.visual.higgsfieldModel+': '+a.visual.higgsfieldPrompt)+')\'>📋 העתק פקודת יצירה</button>';
  }
  h+='</div>';
  h+='<div class="sec"><h3>📱 פלטפורמות</h3><ul>'+a.platforms.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>';
  h+='<div class="sec"><h3>👥 קהל יעד</h3><p>'+esc(a.audience)+'</p></div>';
  h+='<div class="sec"><h3>💎 הערך שהגישה נותנת</h3><p>'+esc(a.value)+'</p></div>';
  h+='<div class="sec"><h3>🔀 שילוב ופיתוח</h3><p>'+esc(a.combine)+'</p>';
  if(a.series)h+='<p style="margin-top:6px"><b>רעיון לסדרה:</b> '+esc(a.series)+'</p>';
  h+='</div>';
  h+='<div class="sec"><h3>🚫 טעויות נפוצות</h3><ul>'+a.mistakes.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul></div>';
  h+='<div class="sec"><h3>💬 דוגמת הוק</h3><div class="ex-hook">"'+esc(a.exampleHook)+'"</div></div>';
  h+='<button class="write-btn" onclick=\'copyCmd('+JSON.stringify('כתוב פוסט מלא בקול שלי בגישת "'+a.name+'" (לפי דף הגישה באפליקציה). נושא: ')+')\'>✍️ כתוב פוסט בגישה הזאת</button>';
  c.innerHTML=h;
  document.getElementById('ap-page').classList.add('open');
  document.getElementById('ap-page').scrollTop=0;
}
function closeApproach(){document.getElementById('ap-page').classList.remove('open')}

/* ---------- Links ---------- */
function renderLinks(data){
  const el=document.getElementById('links');
  let html='<p style="font-size:13px;color:var(--soft);margin-bottom:14px">כל ההשראות והמקורות של המערכת, לפי נושא. כל לינק הוא רעיון לפוסט או לסדרה.</p>';
  for(const cat of data.categories){
    html+='<div class="lk-cat"><h2>'+cat.emoji+' '+esc(cat.name)+'</h2>';
    for(const l of cat.links){
      html+='<a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span class="lk-tag">'+esc(l.tag)+'</span><b>'+esc(l.title)+'</b><p>'+esc(l.desc)+'</p></a>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

/* ---------- Load ---------- */
const v='?v='+Date.now();
fetch('posts.json'+v).then(r=>r.json()).then(renderFeed).catch(()=>{document.getElementById('feed').textContent='לא הצלחתי לטעון את הבריף'});
fetch('approaches.json'+v).then(r=>r.json()).then(renderApproaches).catch(()=>{document.getElementById('approaches').textContent='לא הצלחתי לטעון גישות'});
fetch('links.json'+v).then(r=>r.json()).then(renderLinks).catch(()=>{document.getElementById('links').textContent='לא הצלחתי לטעון לינקים'});
</script>
</body>
</html>
