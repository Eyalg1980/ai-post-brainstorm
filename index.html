<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Post Brainstorm · אייל</title>
<style>
  :root{
    --bg:#F7F5F0; --ink:#1B2A4A; --soft:#5A6784; --card:#FFFFFF;
    --coral:#FF6B5E; --teal:#2BB3A3; --line:#E8E4DB; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Heebo","Rubik",-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);
    padding:16px 16px 60px; max-width:520px;margin:0 auto; line-height:1.55;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .brand{font-size:14px;font-weight:900;letter-spacing:.03em;color:var(--coral)}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--soft);letter-spacing:0}

  .gen-btn{
    border:none;cursor:pointer;font-family:inherit;
    background:var(--ink);color:#fff;font-size:13px;font-weight:700;
    padding:10px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
    box-shadow:0 2px 8px rgba(27,42,74,.18);
  }
  .gen-btn:active{transform:scale(.97)}

  .day{margin-bottom:8px}
  .date-chip{
    position:sticky;top:10px;z-index:5;text-align:center;margin:18px 0 14px;
  }
  .date-chip span{
    display:inline-block;background:#E9E4D8;color:#6B6349;
    font-size:12px;font-weight:700;padding:6px 16px;border-radius:999px;
    box-shadow:0 1px 4px rgba(27,42,74,.08);
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 14px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(27,42,74,.05); position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;top:0;right:0;bottom:0;width:4px;background:var(--accent,var(--coral))}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{
    font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:color-mix(in srgb, var(--accent,var(--coral)) 12%, white);
    color:var(--accent,var(--coral));
    border:1px dashed color-mix(in srgb, var(--accent,var(--coral)) 45%, white);
  }
  .tag.me{background:#FFF7DF;color:#9A7400;border-color:#EED89A}
  .hook{font-size:18px;font-weight:800;line-height:1.42;margin-bottom:10px}
  .label{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.06em;margin-bottom:2px}
  .angle{font-size:14.5px;color:#33405F;margin-bottom:10px}
  .why{font-size:13.5px;color:#33405F;background:#F3F1EA;border-radius:12px;padding:9px 12px;margin-bottom:12px}
  .why b{color:var(--ink)}
  .card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:11px;margin-top:2px}
  .src{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;text-decoration:none;
    color:var(--ink);background:#EFF3FB;border:1px solid #DCE4F5;padding:7px 12px;border-radius:999px;
  }
  .src small{color:var(--soft);font-weight:400}
  .expand-btn{
    border:none;cursor:pointer;font-family:inherit;margin-inline-start:auto;
    background:var(--accent,var(--coral));color:#fff;font-size:12.5px;font-weight:700;
    padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  }
  .expand-btn:active{transform:scale(.97)}

  h2{font-size:14px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px;color:var(--soft)}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .art{
    display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin-bottom:9px;
  }
  .art b{font-size:14px;display:block;margin-bottom:2px;line-height:1.4}
  .art p{font-size:12.5px;color:var(--soft)}
  .art .meta{font-size:11px;color:var(--coral);font-weight:700;margin-top:5px;display:block}

  #toast{
    position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(27,42,74,.3);
    transition:transform .25s ease;z-index:50;max-width:92%;text-align:center;
  }
  #toast.show{transform:translateX(50%) translateY(0)}
  footer{margin-top:26px;text-align:center;font-size:11.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:12px}
  .loading{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="brand">POST BRAINSTORM<small>הבריף היומי של אייל</small></div>
  <button class="gen-btn" onclick="copyCmd('צור עוד 3 רעיונות לפוסטים לבריף של היום, בנוסף לאלה שכבר יש, ועדכן את הדף')">⚡ צור עוד רעיונות</button>
</header>

<div id="feed" class="loading">טוען את הבריף...</div>

<footer>
  לחיצה על כפתור מעתיקה פקודה מוכנה. מדביקים אותה בקלוד, והוא כותב או מייצר ומעדכן את הדף.
</footer>

<div id="toast">הפקודה הועתקה, הדבק אותה בקלוד 👌</div>

<script>
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function copyCmd(cmd){
  const done=()=>{const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cmd).then(done).catch(()=>fallback(cmd,done))}
  else fallback(cmd,done);
}
function fallback(cmd,done){
  const ta=document.createElement('textarea');ta.value=cmd;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');done()}catch(e){prompt('העתק ידנית:',cmd)}
  document.body.removeChild(ta);
}

function render(data){
  const feed=document.getElementById('feed');
  feed.classList.remove('loading');
  let html='';
  const days=[...data.days].sort((a,b)=>b.date.localeCompare(a.date));
  for(const day of days){
    html+='<section class="day">';
    html+='<div class="date-chip"><span>'+esc(day.dateLabel)+'</span></div>';
    for(const idea of (day.ideas||[])){
      const cmd='כתוב פוסט מלא בקול שלי מהרעיון הזה (בריף '+day.dateLabel+'): "'+idea.hook+'"';
      html+='<article class="card" style="--accent:'+esc(idea.color||'#FF6B5E')+'">';
      html+='<div class="tags"><span class="tag">'+esc(idea.pillar)+'</span>';
      if(idea.me)html+='<span class="tag me">✦ '+esc(idea.me)+'</span>';
      html+='</div>';
      html+='<div class="hook">"'+esc(idea.hook)+'"</div>';
      html+='<div class="label">הזווית</div><div class="angle">'+esc(idea.angle)+'</div>';
      html+='<div class="why"><b>למה עכשיו:</b> '+esc(idea.why)+'</div>';
      html+='<div class="card-actions">';
      if(idea.srcUrl)html+='<a class="src" href="'+esc(idea.srcUrl)+'" target="_blank" rel="noopener">🔗 '+esc(idea.srcLabel||'מקור')+(idea.srcDate?' <small>· '+esc(idea.srcDate)+'</small>':'')+'</a>';
      html+='<button class="expand-btn" data-cmd="'+esc(cmd)+'">✍️ כתוב פוסט מלא</button>';
      html+='</div></article>';
    }
    if(day.articles&&day.articles.length){
      html+='<h2>שווה קריאה</h2>';
      for(const a of day.articles){
        html+='<a class="art" href="'+esc(a.url)+'" target="_blank" rel="noopener"><b>'+esc(a.title)+'</b><p>'+esc(a.desc)+'</p><span class="meta">'+esc(a.meta)+'</span></a>';
      }
    }
    html+='</section>';
  }
  feed.innerHTML=html;
  feed.querySelectorAll('.expand-btn').forEach(b=>b.addEventListener('click',()=>copyCmd(b.dataset.cmd)));
}

fetch('posts.json?v='+Date.now())
  .then(r=>r.json()).then(render)
  .catch(()=>{document.getElementById('feed').textContent='לא הצלחתי לטעון את הבריף, נסה לרענן'});
</script>
</body>
</html>
