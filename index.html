<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#F7F5F0">
<title>Post Brainstorm · אייל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* App accent: chrome (app bar, tabs, hero, footer) is always coral. */
    --app:#FF6B5E;
    --app-soft:#FFEDEB;
    --app-line:#FFC9C3;
    /* Content accent: each card overrides these inline with its tag colour. */
    --c:var(--app); --c-soft:var(--app-soft); --c-line:var(--app-line);
    --c-deep:#8A3229; --c-glow:rgba(255,107,94,.28);
    --paper:#F7F5F0; --ink:#141F3D; --soft:#5F6C8A; --white:#FFFFFF;
    --line:#E4E0D6; --line2:#EDEAE1;
    --radius:20px; --bar:61px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:"Rubik","Heebo",-apple-system,"Segoe UI",sans-serif;
    background:var(--paper);color:var(--ink);
    padding:0 14px 40px;max-width:520px;margin:0 auto;line-height:1.55;font-weight:400;
  }

  /* ===== one icon rule: single colour, always inherited ===== */
  .ic{width:1.05em;height:1.05em;flex:none;vertical-align:-.16em;
      fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ic.lg{width:1.25em;height:1.25em}

  /* ===== sticky app bar (the family pattern) ===== */
  .appbar{
    position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:10px;
    background:rgba(247,245,240,.94);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    margin:0 -14px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
  }
  .back{width:38px;height:38px;min-width:38px;border-radius:50%;border:1.5px dashed var(--line);
        background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;
        cursor:pointer;font-family:inherit;transition:opacity .18s,border-color .18s,color .18s}
  .back svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
  .back:disabled{opacity:.26;cursor:default}
  .back:not(:disabled):active{border-color:var(--app);color:var(--app);border-style:solid}
  .logo{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}
  .logo .mark{width:30px;height:30px;min-width:30px;border-radius:9px;background:var(--app);color:var(--white);
              display:flex;align-items:center;justify-content:center}
  .logo .mark svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
  .logo .wm{font-family:"Poppins",sans-serif;font-size:16px;font-weight:300;letter-spacing:1.9px;
            text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo .wm b{font-weight:700;color:var(--app)}
  .abspacer{width:38px;min-width:38px}

  /* ===== hero ===== */
  .hero{text-align:center;padding:22px 6px 2px}
  .kicker{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--app);
          font-size:10.5px;font-weight:700;letter-spacing:.09em;padding:5px 14px;border-radius:999px;margin-bottom:12px}
  .hero h1{font-weight:900;font-size:clamp(30px,9.5vw,40px);letter-spacing:-1px;line-height:1.05;
           position:relative;display:inline-block;padding-bottom:16px}
  .hero h1 .scribble{position:absolute;right:-6px;left:-6px;bottom:0;width:calc(100% + 12px);height:20px;pointer-events:none}
  .hero .sub{font-size:12.5px;color:var(--soft);font-weight:500;margin-top:8px}
  .gen-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:7px;
           border:none;cursor:pointer;font-family:inherit;background:var(--app);color:var(--white);
           font-size:15px;font-weight:700;padding:14px 12px;border-radius:16px;margin:18px 0 0;
           box-shadow:0 3px 14px rgba(255,107,94,.28)}
  .gen-btn:active{transform:scale(.985)}

  /* ===== tabs ===== */
  .navwrap{position:sticky;top:var(--bar);z-index:30;background:var(--paper);padding:10px 0;margin:0 0 4px}
  nav{display:flex;gap:5px;background:#ECE8DE;border-radius:999px;padding:4px}
  nav button{flex:1;border:none;cursor:pointer;font-family:inherit;background:transparent;color:var(--soft);
             font-size:12.5px;font-weight:600;padding:9px 2px;border-radius:999px;transition:all .15s;
             display:inline-flex;align-items:center;justify-content:center;gap:5px}
  nav button.active{background:var(--white);color:var(--app);box-shadow:0 1px 4px rgba(20,31,61,.12)}
  .screen{display:none}
  .screen.active{display:block}

  /* ===== feed bar ===== */
  .feed-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--white);
            border:1.5px dashed var(--line);border-radius:16px;padding:9px 11px;margin-bottom:6px}
  .feed-bar .cnt{font-size:11.5px;font-weight:600;color:var(--soft);margin-inline-end:auto;display:inline-flex;align-items:center;gap:6px}
  .feed-bar .cnt b{color:var(--ink);font-weight:700}
  .fb-btn{border:1.5px dashed var(--line);cursor:pointer;font-family:inherit;background:var(--white);color:var(--soft);
          font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .fb-btn.on{background:var(--app);color:var(--white);border-color:var(--app);border-style:solid}
  .fb-btn:active{transform:scale(.97)}

  /* ===== idea cards ===== */
  .date-chip{text-align:center;margin:20px 0 14px}
  .date-chip span{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--app);
                  font-size:11.5px;font-weight:700;padding:6px 16px;border-radius:999px;letter-spacing:.02em}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
        padding:18px 17px 14px;margin-bottom:14px;position:relative;overflow:hidden}
  /* the tag stripe: full-width bar at the top of the card, in the tag colour */
  .card::before{content:"";position:absolute;top:0;inset-inline:0;height:4px;background:var(--c)}
  /* every icon inside a card inherits that card's tag colour */
  .card .label .ic,.card .tag .ic,.card .src .ic,.card .why .ic{color:var(--c)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px;
       background:var(--c-soft);color:var(--c);border:1px dashed var(--c-line);
       display:inline-flex;align-items:center;gap:4px}
  .tag .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
  .tag.ghost{background:none;color:var(--soft);border-color:var(--line)}
  .hook{font-size:18px;font-weight:700;line-height:1.42;margin-bottom:12px}
  .label{font-size:10.5px;font-weight:700;color:var(--soft);letter-spacing:.08em;margin-bottom:3px;
         display:flex;align-items:center;gap:5px;text-transform:uppercase}
  .angle{font-size:14.5px;color:#2C3757;margin-bottom:11px}
  .why{font-size:13.5px;color:#2C3757;background:#F4F2EC;border-radius:13px;padding:10px 12px;margin-bottom:13px}
  .why b{color:var(--c)}

  .prompts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 13px}
  .p-btn{border:1.5px dashed var(--line);cursor:pointer;font-family:inherit;background:var(--white);color:var(--soft);
         font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:999px;
         display:inline-flex;align-items:center;gap:5px}
  .p-btn.ready{color:var(--ink);border-color:var(--c-line);border-style:solid}
  .p-btn.ready::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--c)}
  .p-btn:active{background:var(--c-soft);transform:scale(.97)}

  .card-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;
                border-top:1.5px dashed var(--line2);padding-top:12px}
  .act-row{display:flex;gap:8px;align-items:center}
  .src{align-self:flex-start;max-width:100%;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
       text-decoration:none;color:var(--ink);border:1.5px dashed var(--line);padding:7px 13px;border-radius:16px;background:var(--white)}
  .src span{min-width:0}
  .src small{color:var(--soft);font-weight:400;white-space:nowrap}
  .icon-btn{border:1.5px dashed var(--line);cursor:pointer;font-family:inherit;background:var(--white);color:var(--soft);
            width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
  .icon-btn:active{color:var(--c);border-color:var(--c)}
  .use-btn{border:1.5px dashed var(--line);cursor:pointer;font-family:inherit;background:var(--white);color:var(--soft);
           font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .use-btn.on{background:var(--c-soft);border:1.5px solid var(--c-line);color:var(--c)}
  .expand-btn{border:none;cursor:pointer;font-family:inherit;margin-inline-start:auto;background:var(--ink);color:var(--white);
              font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .expand-btn:active{transform:scale(.97)}
  .card.used{opacity:.5}
  .card.used::before{background:var(--line)}
  .card.used .hook{text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:#B9C0CF}

  h2{font-size:12.5px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px;
     color:var(--soft);letter-spacing:.05em;text-transform:uppercase}
  h2::after{content:"";flex:1;height:1.5px;background:var(--line);border-radius:2px}
  .art{display:block;text-decoration:none;color:inherit;background:var(--white);border:1px solid var(--line);
       border-radius:16px;padding:12px 15px;margin-bottom:9px}
  .art b{font-size:14px;display:block;margin-bottom:2px;line-height:1.4;font-weight:600}
  .art p{font-size:12.5px;color:var(--soft)}
  .art .meta{font-size:10.5px;color:var(--app);font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px}

  /* ===== approaches ===== */
  .intro{font-size:13px;color:var(--soft);margin:2px 2px 14px;line-height:1.6}
  .ap-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
           padding:15px 16px 14px;margin-bottom:11px;position:relative;overflow:hidden;
           cursor:pointer;display:block;width:100%;text-align:start;font-family:inherit;color:inherit}
  .ap-card::before{content:"";position:absolute;top:0;inset-inline:0;height:4px;background:var(--c)}
  .ap-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .ap-ico{width:36px;height:36px;min-width:36px;border-radius:11px;background:var(--c-soft);color:var(--c);
          display:flex;align-items:center;justify-content:center;font-size:19px}
  .ap-name{font-size:16px;font-weight:700;flex:1}
  .ap-head .go{color:var(--soft);font-size:15px;display:flex}
  .ap-tagline{font-size:13.5px;color:#2C3757;margin-bottom:10px}
  .ap-badges{display:flex;gap:5px;flex-wrap:wrap}
  .badge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px;
         background:none;color:var(--soft);border:1px dashed var(--line)}

  .ap-hero{background:var(--ink);border-radius:var(--radius);padding:20px 18px;margin:16px 0 14px;color:var(--white);position:relative;overflow:hidden}
  .ap-hero::after{content:"";position:absolute;top:-60px;inset-inline-start:-30px;width:170px;height:170px;border-radius:50%;
                  background:radial-gradient(circle,var(--c-glow),transparent 68%)}
  .ap-hero .ap-ico{background:var(--c);color:var(--white);width:42px;height:42px;border-radius:13px;font-size:22px;margin-bottom:10px;position:relative;z-index:1}
  .ap-hero h1{font-size:22px;font-weight:800;line-height:1.3;margin-bottom:4px;position:relative;z-index:1}
  .ap-hero p{font-size:13.5px;opacity:.85;position:relative;z-index:1}
  .sec{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px}
  .sec h3 .ic{color:var(--c)}
  .sec h3{font-size:11.5px;font-weight:700;color:var(--soft);letter-spacing:.06em;margin-bottom:9px;
          display:flex;align-items:center;gap:6px;text-transform:uppercase}
  .sec p{font-size:14px;color:#2C3757}
  .sec ol,.sec ul{padding-inline-start:19px;font-size:14px;color:#2C3757}
  .sec ol li,.sec ul li{margin-bottom:6px}
  .sec ol li::marker{color:var(--c);font-weight:700}
  .sec ul li::marker{color:var(--c)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:none;color:var(--soft);border:1px dashed var(--line)}
  .prompt-box{background:var(--ink);color:#D8DFF2;border-radius:13px;padding:12px;font-size:12px;direction:ltr;text-align:left;
              font-family:ui-monospace,monospace;line-height:1.5;margin-top:8px;word-break:break-word}
  .copy-mini{border:1.5px dashed var(--c-line);cursor:pointer;font-family:inherit;background:var(--c-soft);color:var(--c);
             font-size:12px;font-weight:700;padding:8px 15px;border-radius:999px;margin-top:9px;display:inline-flex;align-items:center;gap:6px}
  .ex-hook{background:var(--c-soft);border:1.5px dashed var(--c-line);border-radius:13px;padding:12px 13px;
           font-size:14px;font-weight:500;color:var(--c-deep)}
  .write-btn{border:none;cursor:pointer;font-family:inherit;width:100%;background:var(--c);color:var(--white);
             font-size:14.5px;font-weight:700;padding:14px;border-radius:16px;margin-top:6px;
             display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 3px 14px var(--c-glow)}

  /* ===== links ===== */
  .lk-filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 14px;scrollbar-width:none}
  .lk-filters::-webkit-scrollbar{display:none}
  .fchip{flex:none;border:1.5px dashed var(--line);background:var(--white);color:var(--soft);cursor:pointer;font-family:inherit;
         font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .fchip.on{background:var(--app);color:var(--white);border-color:var(--app);border-style:solid}
  .lk-cat{margin-bottom:20px}
  .lk-cat h2{margin-top:0}
  .lk{display:block;text-decoration:none;color:inherit;background:var(--white);border:1px solid var(--line);
      border-radius:15px;padding:12px 14px;margin-bottom:8px;position:relative}
  .lk b{font-size:13.5px;display:block;line-height:1.4;font-weight:600;padding-inline-end:70px}
  .lk p{font-size:12px;color:var(--soft);margin-top:2px}
  .lk .lk-tag{position:absolute;top:11px;left:12px;font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;
              background:var(--app-soft);color:var(--app)}

  /* ===== chrome ===== */
  #toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%) translateY(90px);background:var(--ink);color:var(--white);
         font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(20,31,61,.32);
         transition:transform .25s ease;z-index:60;max-width:92%;text-align:center;display:inline-flex;align-items:center;gap:7px}
  #toast.show{transform:translateX(50%) translateY(0)}
  footer{margin-top:26px;text-align:center;font-size:11.5px;color:var(--soft);border-top:1.5px dashed var(--line);padding-top:14px;line-height:1.8}
  .applinks{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .applinks a{text-decoration:none;color:var(--soft);border:1.5px dashed var(--line);background:var(--white);
              font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  .loading{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
</style>
</head>
<body>

<div class="appbar">
  <button class="back" id="btn-back" onclick="goBack()" aria-label="חזרה" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  <div class="logo">
    <span class="mark"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 2.8a6.4 6.4 0 0 0-3.8 11.5c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.4 6.4 0 0 0 12 2.8Z"/></svg></span>
    <span class="wm">Post <b>Brainstorm</b></span>
  </div>
  <div class="abspacer"></div>
</div>

<!-- ===================== main ===================== -->
<div class="screen active" id="scr-app">

  <div class="hero">
    <span class="kicker"><svg class="ic" viewBox="0 0 24 24"><path d="m13 2-8.5 11.2H12l-1 8.8 8.5-11.2H12l1-8.8Z"/></svg> מנוע הרעיונות לפוסטים</span>
    <h1>רעיונות לפוסטים<svg class="scribble" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M6 12 C 44 4, 92 17, 138 8 C 162 3, 184 7, 195 11" stroke="#FF6B5E" stroke-width="4.2" fill="none" stroke-linecap="round"/><path d="M14 17 C 58 11, 104 19, 150 14 C 170 11, 184 13, 192 15" stroke="#FF6B5E" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/></svg></h1>
    <p class="sub">בריף יומי · גישות כתיבה · מאגרי השראה</p>
  </div>

  <button class="gen-btn" id="gen-btn" onclick="copyCmd('צור עוד 3 רעיונות לפוסטים לבריף של היום, בנוסף לאלה שכבר יש, ועדכן את הדף')">
    <svg class="ic lg" viewBox="0 0 24 24"><path d="m13 2-8.5 11.2H12l-1 8.8 8.5-11.2H12l1-8.8Z"/></svg> צור עוד רעיונות
  </button>

  <div class="navwrap"><nav>
    <button class="active" data-tab="feed" onclick="showTab('feed')"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 2.8a6.4 6.4 0 0 0-3.8 11.5c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.4 6.4 0 0 0 12 2.8Z"/></svg> הבריף</button>
    <button data-tab="approaches" onclick="showTab('approaches')"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1"/></svg> גישות</button>
    <button data-tab="links" onclick="showTab('links')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5.2C4 4 4.8 3.2 6 3.2h3.4c1.2 0 2 .8 2 2V21l-3.7-2.4L4 21Z"/><path d="M13.4 6.6 16.7 5.5c1.1-.4 2.2.1 2.5 1.2l3.1 9.4"/><path d="M11.4 9.6h8.4"/></svg> מאגרים</button>
  </nav></div>

  <div id="feed" class="tab"><div class="loading">טוען את הבריף...</div></div>
  <div id="approaches" class="tab" style="display:none"><div class="loading">טוען גישות...</div></div>
  <div id="links" class="tab" style="display:none"><div class="loading">טוען לינקים...</div></div>

</div>

<!-- ===================== approach page ===================== -->
<div class="screen" id="scr-approach"><div id="ap-page-content"></div></div>

<footer>
  <div class="applinks">

/* ---------- tag colours: every idea / approach carries its own accent ---------- */
const PALETTE=['#FF6B5E','#2BB3A3','#7B61FF','#FFC940','#3D8BFF','#E8598B','#F2A03D','#1B2A4A'];
const PILLAR_C={'Figma Weave':'#FF6B5E','הוראה והכשרה של AI':'#2BB3A3','UX + AI':'#7B61FF'};
function hex2rgb(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');
  return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
function toHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function tint(h,t){return toHex(hex2rgb(h).map(v=>v+(255-v)*t))}
function shade(h,t){return toHex(hex2rgb(h).map(v=>v*(1-t)))}
function hashPick(s){let h=0;for(let i=0;i<(s||'').length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PALETTE[h%PALETTE.length]}
function tagColor(o){
  const c=o&&o.color;
  if(c&&/^#[0-9a-fA-F]{6}$/.test(c))return c;
  return PILLAR_C[o&&o.pillar]||hashPick((o&&(o.pillar||o.name||o.id))||'');
}
/* returns an inline style string that re-points --c and friends for one card */
function cvars(hex){
  const [r,g,b]=hex2rgb(hex);
  return '--c:'+hex+';--c-soft:'+tint(hex,.89)+';--c-line:'+tint(hex,.60)
       +';--c-deep:'+shade(hex,.40)+';--c-glow:rgba('+r+','+g+','+b+',.28)';
}

function ico(name,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24">'+(I[name]||'')+'</svg>'}

/* ---------- helpers ---------- */
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function copyCmd(cmd){
  const done=()=>{const t=document.getElementById('toast');t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(cmd).then(done).catch(()=>fallback(cmd,done))}
  else fallback(cmd,done);
}
function fallback(cmd,done){
  const ta=document.createElement('textarea');ta.value=cmd;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');done()}catch(e){prompt('העתק ידנית:',cmd)}
  document.body.removeChild(ta);
}
function waShare(text){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}

/* ---------- navigation: one history stack, one back button ---------- */
let navHist=[], cur={screen:'app',tab:'feed'};
function stateKey(s){return s.screen+':'+(s.tab||'')+':'+(s.ap||'')}
function syncBack(){document.getElementById('btn-back').disabled=navHist.length===0}
function apply(s){
  document.getElementById('scr-app').classList.toggle('active',s.screen==='app');
  document.getElementById('scr-approach').classList.toggle('active',s.screen==='approach');
  if(s.screen==='app'){
    ['feed','approaches','links'].forEach(t=>{document.getElementById(t).style.display=(t===s.tab?'block':'none')});
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===s.tab));
    document.getElementById('gen-btn').style.display=(s.tab==='feed'?'flex':'none');
  }
  cur=s; syncBack(); window.scrollTo({top:0});
}
function go(s){
  if(stateKey(s)===stateKey(cur))return;
  navHist.push(cur); if(navHist.length>25)navHist.shift();
  apply(s);
  try{history.pushState({k:stateKey(s)},'')}catch(e){}
}
/* the phone's own back gesture walks the same stack */
window.addEventListener('popstate',()=>{if(navHist.length)apply(navHist.pop())});
function goBack(){if(!navHist.length)return; if(history.state&&history.state.k){history.back()}else{apply(navHist.pop())}}
function showTab(id){go({screen:'app',tab:id})}

/* ---------- brief feed ---------- */
let FEED=null,PBANK=[],WABANK=[];
const LS_USED='apb_used',LS_HIDE='apb_hide_used';
function usedSet(){try{return new Set(JSON.parse(localStorage.getItem(LS_USED)||'[]'))}catch(e){return new Set()}}
function saveUsed(s){try{localStorage.setItem(LS_USED,JSON.stringify([...s]))}catch(e){}}
function hideUsed(){return localStorage.getItem(LS_HIDE)==='1'}

/* Four ready copy targets per idea. JSON-supplied prompts are copied as-is,
   missing ones fall back to a command for Claude. */
function buildPrompts(idea,day){
  const p=idea.prompts||{};
  const ref='הרעיון: "'+idea.hook+'". הזווית: '+idea.angle;
  return [
    {k:'image',ic:'image',label:'ויזואל',ready:!!p.image,
     val:p.image?('צור לי תמונה בהיגספילד לפי הפרומפט הזה: '+p.image):
                 ('צור לי ויזואל לפוסט הזה: כתוב פרומפט תמונה באנגלית בשפה הוויזואלית של סימפלה, ואז הרץ אותו בהיגספילד. '+ref)},
    {k:'video',ic:'film',label:'רילס קצר',ready:!!p.video,
     val:p.video?('צור לי סרטון בהיגספילד לפי הפרומפט הזה: '+p.video):
                 ('הפוך את הרעיון הזה לרילס של 15 עד 20 שניות: תסריט קצר, שוט ליסט ופרומפט וידאו מוכן להיגספילד ב-9:16. '+ref)},
    {k:'carousel',ic:'cards',label:'קרוסלה',ready:!!p.carousel,
     val:p.carousel||('פרק את הרעיון הזה לקרוסלה של 6 עד 7 שקפים: כותרת לכל שקף, שורת גוף אחת, ושקף אחרון עם שאלה. '+ref)},
    {k:'raw',ic:'text',label:'טקסט גולמי',ready:true,
     val:'הוק: '+idea.hook+'\n\nזווית: '+idea.angle+'\n\nלמה עכשיו: '+idea.why+'\n\nמקור: '+(idea.srcLabel||'')+' '+(idea.srcUrl||'')+'\n(בריף '+day.dateLabel+')'}
  ];
}

function renderFeed(data){
  if(data)FEED=data;
  const feed=document.getElementById('feed');
  const used=usedSet(),hide=hideUsed();
  PBANK=[];WABANK=[];
  const days=[...FEED.days].sort((a,b)=>b.date.localeCompare(a.date));
  let total=0,nUsed=0,pending=[];
  for(const day of days)for(const idea of (day.ideas||[])){
    total++;
    const isUsed=used.has(idea.id)||idea.used===true;
    if(isUsed)nUsed++;
    if(used.has(idea.id)&&idea.used!==true)pending.push(idea.id);
  }
  let html='<div class="feed-bar"><span class="cnt">'+ico('check')+'<b>'+nUsed+'</b> נוצלו מתוך '+total+'</span>';
  html+='<button class="fb-btn'+(hide?' on':'')+'" id="fb-hide">'+ico(hide?'eye':'eyeoff')+(hide?'מציג פתוחים':'הסתר נוצלו')+'</button>';
  if(pending.length)html+='<button class="fb-btn" id="fb-sync">'+ico('save')+'שמור ('+pending.length+')</button>';
  html+='<button class="fb-btn" id="fb-wa">'+ico('wa')+'שתף</button>';
  html+='</div>';
  for(const day of days){
    const ideas=(day.ideas||[]).filter(i=>!(hide&&(used.has(i.id)||i.used===true)));
    if(!ideas.length&&hide)continue;
    html+='<section><div class="date-chip"><span>'+ico('cal')+esc(day.dateLabel)+'</span></div>';
    for(const idea of ideas){
      const isUsed=used.has(idea.id)||idea.used===true;
      const cmd='כתוב פוסט מלא בקול שלי מהרעיון הזה (בריף '+day.dateLabel+'): "'+idea.hook+'"';
      const col=tagColor(idea);
      html+='<article class="card'+(isUsed?' used':'')+'" style="'+cvars(col)+'">';
      html+='<div class="tags"><span class="tag"><i class="dot"></i>'+esc(idea.pillar)+'</span>';
      if(idea.me)html+='<span class="tag ghost">'+ico('pen')+esc(idea.me)+'</span>';
      if(isUsed)html+='<span class="tag ghost">'+ico('check')+'נוצל</span>';
      html+='</div><div class="hook">"'+esc(idea.hook)+'"</div>';
      html+='<div class="label">'+ico('target')+'הזווית</div><div class="angle">'+esc(idea.angle)+'</div>';
      html+='<div class="why"><b>למה עכשיו:</b> '+esc(idea.why)+'</div>';
      const pi=PBANK.push(buildPrompts(idea,day))-1;
      html+='<div class="label">'+ico('copy')+'פרומפטים מוכנים</div><div class="prompts">';
      PBANK[pi].forEach(p=>{html+='<button class="p-btn'+(p.ready?' ready':'')+'" data-p="'+pi+'" data-k="'+p.k+'">'+ico(p.ic)+p.label+'</button>'});
      html+='</div>';
      html+='<div class="card-actions">';
      if(idea.srcUrl)html+='<a class="src" href="'+esc(idea.srcUrl)+'" target="_blank" rel="noopener">'+ico('link')+'<span>'+esc(idea.srcLabel||'מקור')+(idea.srcDate?' <small>· '+esc(idea.srcDate)+'</small>':'')+'</span></a>';
      const wi=WABANK.push('"'+idea.hook+'"\n\n'+idea.angle+'\n\n'+(idea.srcUrl?'מקור: '+idea.srcUrl+'\n\n':'')+'מתוך הבריף של '+day.dateLabel+':\n'+SITE)-1;
      html+='<div class="act-row">';
      html+='<button class="icon-btn" data-wa="'+wi+'" aria-label="שיתוף בוואטסאפ">'+ico('wa')+'</button>';
      html+='<button class="use-btn'+(isUsed?' on':'')+'" data-use="'+esc(idea.id)+'">'+ico('check')+(isUsed?'נוצל':'סמן כנוצל')+'</button>';
      html+='<button class="expand-btn" data-cmd="'+esc(cmd)+'">'+ico('pen')+'כתוב פוסט מלא</button>';
      html+='</div></div></article>';
    }
    if(day.articles&&day.articles.length){
      html+='<h2>'+ico('news')+'שווה קריאה</h2>';
      for(const a of day.articles){
        html+='<a class="art" href="'+esc(a.url)+'" target="_blank" rel="noopener"><b>'+esc(a.title)+'</b><p>'+esc(a.desc)+'</p><span class="meta">'+ico('link')+esc(a.meta)+'</span></a>';
      }
    }
    html+='</section>';
  }
  feed.innerHTML=html;
  feed.querySelectorAll('.expand-btn').forEach(b=>b.addEventListener('click',()=>copyCmd(b.dataset.cmd)));
  feed.querySelectorAll('.p-btn').forEach(b=>b.addEventListener('click',()=>{
    const p=(PBANK[+b.dataset.p]||[]).find(x=>x.k===b.dataset.k);if(p)copyCmd(p.val);
  }));
  feed.querySelectorAll('.use-btn').forEach(b=>b.addEventListener('click',()=>{
    const s=usedSet(),id=b.dataset.use;
    if(s.has(id))s.delete(id);else s.add(id);
    saveUsed(s);renderFeed();
  }));
  feed.querySelectorAll('.icon-btn[data-wa]').forEach(b=>b.addEventListener('click',()=>waShare(WABANK[+b.dataset.wa])));
  const fw=document.getElementById('fb-wa');
  if(fw)fw.addEventListener('click',()=>waShare('Post Brainstorm, הרעיונות לפוסטים של היום:\n'+SITE));
  const fh=document.getElementById('fb-hide');
  if(fh)fh.addEventListener('click',()=>{localStorage.setItem(LS_HIDE,hide?'0':'1');renderFeed()});
  const fs=document.getElementById('fb-sync');
  if(fs)fs.addEventListener('click',()=>copyCmd('סמן את הרעיונות האלה כנוצלו ב-posts.json (used: true) ופרסם: '+pending.join(', ')));
}

/* ---------- approaches ---------- */
let APPROACHES=[];
const AP_ICON={'story-lesson':'ap_story','class-to-field':'ap_class','object-bio':'ap_object','two-points':'ap_time',
               'prophecy-checkin':'ap_prophecy','visual-riddle':'ap_riddle','tools-shortlist':'ap_tools','numbers-compare':'ap_numbers'};
function apIcon(id){return ico(AP_ICON[id]||'target')}
function renderApproaches(data){
  APPROACHES=data.approaches;
  const el=document.getElementById('approaches');
  let html='<p class="intro">'+APPROACHES.length+' גישות מנותחות לעומק. כל דף גישה מכיל את המבנה, הוויזואל, טעויות נפוצות ופרומפט מוכן.</p>';
  for(const a of APPROACHES){
    html+='<button class="ap-card" data-id="'+esc(a.id)+'" style="'+cvars(tagColor(a))+'">';
    html+='<div class="ap-head"><span class="ap-ico">'+apIcon(a.id)+'</span><span class="ap-name">'+esc(a.name)+'</span><span class="go">'+ico('chev')+'</span></div>';
    html+='<div class="ap-tagline">'+esc(a.tagline)+'</div>';
    html+='<div class="ap-badges">'+a.badges.map(b=>'<span class="badge">'+esc(b)+'</span>').join('')+'</div>';
    html+='</button>';
  }
  el.innerHTML=html;
  el.querySelectorAll('.ap-card').forEach(b=>b.addEventListener('click',()=>openApproach(b.dataset.id)));
}
function openApproach(id){
  const a=APPROACHES.find(x=>x.id===id);if(!a)return;
  const c=document.getElementById('ap-page-content');
  c.setAttribute('style',cvars(tagColor(a)));
  let h='<div class="ap-hero"><span class="ap-ico">'+apIcon(a.id)+'</span><h1>'+esc(a.name)+'</h1><p>'+esc(a.tagline)+'</p></div>';
  h+='<div class="sec"><h3>'+ico('target')+'תחומים שאפשר להחיל עליהם</h3><div class="chips">'+a.domains.map(d=>'<span class="chip">'+esc(d)+'</span>').join('')+'</div></div>';
  h+='<div class="sec"><h3>'+ico('text')+'המבנה, צעד אחרי צעד</h3><ol>'+a.structure.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>';
  h+='<div class="sec"><h3>'+ico('image')+'ויזואל · '+esc(a.visual.type)+'</h3><p>'+esc(a.visual.desc)+'</p>';
  if(a.visual.higgsfieldPrompt){
    h+='<p style="margin-top:8px;font-size:12px;color:var(--soft)">פרומפט היגספילד ('+esc(a.visual.higgsfieldModel)+'), מחליפים את מה שבסוגריים:</p>';
    h+='<div class="prompt-box">'+esc(a.visual.higgsfieldPrompt)+'</div>';
    h+='<button class="copy-mini" onclick=\'copyCmd('+JSON.stringify('צור לי ויזואל בהיגספילד לפי הפרומפט הזה, מודל '+a.visual.higgsfieldModel+': '+a.visual.higgsfieldPrompt)+')\'>'+ico('copy')+'העתק פקודת יצירה</button>';
  }
  h+='</div>';
  h+='<div class="sec"><h3>'+ico('film')+'פלטפורמות</h3><ul>'+a.platforms.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>';
  h+='<div class="sec"><h3>'+ico('bulb')+'קהל יעד</h3><p>'+esc(a.audience)+'</p></div>';
  h+='<div class="sec"><h3>'+ico('bolt')+'הערך שהגישה נותנת</h3><p>'+esc(a.value)+'</p></div>';
  h+='<div class="sec"><h3>'+ico('cards')+'שילוב ופיתוח</h3><p>'+esc(a.combine)+'</p>';
  if(a.series)h+='<p style="margin-top:6px"><b>רעיון לסדרה:</b> '+esc(a.series)+'</p>';
  h+='</div>';
  h+='<div class="sec"><h3>'+ico('eyeoff')+'טעויות נפוצות</h3><ul>'+a.mistakes.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul></div>';
  h+='<div class="sec"><h3>'+ico('pen')+'דוגמת הוק</h3><div class="ex-hook">"'+esc(a.exampleHook)+'"</div></div>';
  h+='<button class="write-btn" onclick=\'copyCmd('+JSON.stringify('כתוב פוסט מלא בקול שלי בגישת "'+a.name+'" (לפי דף הגישה באפליקציה). נושא: ')+')\'>'+ico('pen','lg')+'כתוב פוסט בגישה הזאת</button>';
  c.innerHTML=h;
  go({screen:'approach',ap:a.id});
}

/* ---------- links ---------- */
let LINKS=null,lkFilter=-1;
function renderLinks(data){
  if(data)LINKS=data;
  const el=document.getElementById('links');
  let html='<p class="intro">כל ההשראות והמקורות של המערכת, לפי נושא. כל לינק הוא רעיון לפוסט או לסדרה.</p>';
  html+='<div class="lk-filters"><button class="fchip'+(lkFilter<0?' on':'')+'" data-f="-1">הכל</button>';
  LINKS.categories.forEach((c,i)=>{html+='<button class="fchip'+(lkFilter===i?' on':'')+'" data-f="'+i+'">'+ico('c'+(i%8))+esc(c.name)+'</button>'});
  html+='</div>';
  LINKS.categories.forEach((cat,i)=>{
    if(lkFilter>=0&&lkFilter!==i)return;
    html+='<div class="lk-cat"><h2>'+ico('c'+(i%8))+esc(cat.name)+'</h2>';
    for(const l of cat.links){
      html+='<a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener"><span class="lk-tag">'+esc(l.tag)+'</span><b>'+esc(l.title)+'</b><p>'+esc(l.desc)+'</p></a>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click',()=>{lkFilter=+b.dataset.f;renderLinks()}));
}

fetch('approaches.json'+v).then(r=>r.json()).then(renderApproaches).catch(()=>{document.getElementById('approaches').textContent='לא הצלחתי לטעון גישות'});
fetch('links.json'+v).then(r=>r.json()).then(renderLinks).catch(()=>{document.getElementById('links').textContent='לא הצלחתי לטעון לינקים'});
</script>
